<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Resource - EduCloud Studio</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card-dark {
      background-color: #0f172a;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body class="p-4 md:p-8 max-w-xl mx-auto min-h-screen flex items-center justify-center">

  <div class="card-dark w-full rounded-2xl p-6 md:p-8 shadow-2xl space-y-6 border border-slate-800">
    
    <!-- Title Section -->
    <div class="flex items-center gap-3 pb-4 border-b border-slate-800">
      <div class="w-10 h-10 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-xl">
        ➕
      </div>
      <div>
        <h2 class="text-xl font-bold text-white">Add New Study Resource</h2>
        <p class="text-xs text-slate-400">Barsoi Public School</p>
      </div>
    </div>

    <!-- Alert / Message Box -->
    <div id="statusMsg" class="hidden p-3 rounded-xl text-xs font-semibold text-center"></div>

    <!-- Form -->
    <form id="resourceForm" class="space-y-4">
      
      <!-- Class -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Class (A1)</label>
        <input type="text" id="className" placeholder="e.g. Class 12th" required 
          class="w-full bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <!-- Subject -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Subject (B1)</label>
        <input type="text" id="subject" placeholder="e.g. Zoology" required 
          class="w-full bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <!-- Title -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Title (C1)</label>
        <input type="text" id="title" placeholder="e.g. Reproduction in Flowering Plants" required 
          class="w-full bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <!-- Type -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Type (D1)</label>
        <select id="type" class="w-full bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
          <option value="PDF">PDF</option>
          <option value="Video">Video</option>
          <option value="Assignment">Assignment</option>
          <option value="Notes">Notes</option>
        </select>
      </div>

      <!-- Link -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Resource Drive/Web Link (E1)</label>
        <input type="url" id="link" placeholder="https://drive.google.com/..." required 
          class="w-full bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" 
        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition shadow-lg shadow-indigo-600/30 text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane"></i> Submit Resource
      </button>

    </form>
  </div>

  <script>
    // Integrated Google Apps Script URL
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxFeYXYZKELFpRAsIyvdn4fL6iUVbV2eiS6dMVKUK2r_s02bJGTMNx4Xj7yVg-qdrE6/exec";

    const form = document.getElementById('resourceForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Submitting...`;
      statusMsg.className = "hidden";

      const payload = {
        className: document.getElementById('className').value,
        subject: document.getElementById('subject').value,
        title: document.getElementById('title').value,
        type: document.getElementById('type').value,
        link: document.getElementById('link').value
      };

      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusMsg.innerText = "Resource successfully submitted.";
        statusMsg.className = "p-3 rounded-xl text-xs font-semibold text-center bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
        form.reset();

      } catch (err) {
        console.error("Error submitting:", err);
        statusMsg.innerText = "Submit karne me koi dikkat aayi.";
        statusMsg.className = "p-3 rounded-xl text-xs font-semibold text-center bg-red-500/10 text-red-400 border border-red-500/20";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Submit Resource`;
      }
    });
  </script>
</body>
</html>
